name: checkedin_mobile
description: CheckedIn student mobile app — QR attendance with location and selfie.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  go_router: ^16.0.0
  mobile_scanner: ^7.0.1
  geolocator: ^14.0.2
  camera: ^0.11.2
  image: ^4.5.4
  screen_capture_event: ^1.2.0
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  connectivity_plus: ^7.2.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
