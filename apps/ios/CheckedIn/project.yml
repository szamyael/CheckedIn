name: CheckedIn
options:
  bundleIdPrefix: com.checkedin
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  CheckedIn:
    type: application
    platform: iOS
    sources:
      - path: CheckedIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checkedin.student
        INFOPLIST_FILE: CheckedIn/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
    dependencies:
      - package: Supabase
        product: Supabase
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
